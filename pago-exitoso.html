<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pago exitoso · Filtro Vehicular+</title>
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg?v=2">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI", "Segoe UI Variable Text", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f5f5f5;
    padding: 20px;
    color: #141d1c;
  }
  .card {
    background: #fff;
    border-radius: 18px;
    max-width: 440px;
    width: 100%;
    padding: 44px 36px 32px;
    text-align: center;
  }
  .icon {
    width: 72px;
    height: 72px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: #8fc72e;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon svg { width: 38px; height: 38px; color: #fff; }
  h1 { font-size: 26px; font-weight: 700; margin-bottom: 10px; letter-spacing: -.5px; }
  p { font-size: 14px; color: #6b7280; line-height: 1.6; margin-bottom: 26px; }
  .btn {
    display: block;
    width: 100%;
    padding: 14px 20px;
    background: #141d1c;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    transition: background .15s;
    font-family: inherit;
  }
  .btn:hover { background: #0e1312; }
  .hint {
    margin-top: 14px;
    font-size: 11.5px;
    color: #9CA3AF;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="5 13 10 18 20 7"/>
      </svg>
    </div>
    <h1>Pago confirmado</h1>
    <p>Tu pago fue procesado correctamente.<br>Los créditos se acreditaron en tu cuenta de forma automática.</p>
    <a href="app.html" class="btn">Volver al dashboard</a>
    <p class="hint">Redirigiendo en <span id="c">6</span> s…</p>
  </div>
<script>
  var s = 6;
  var el = document.getElementById('c');
  var t = setInterval(function () {
    s--;
    el.textContent = s;
    if (s <= 0) { clearInterval(t); location.href = 'app.html?payment=success'; }
  }, 1000);
</script>
</body>
</html>
