<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pago exitoso · Filtro Vehicular+</title>
<link rel="icon" type="image/png" href="/favicon-fvplus.png" sizes="192x192">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Inter", "Segoe UI", "Segoe UI Variable Text", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f6f6f6;
    padding: 20px;
    color: #171717;
  }
  .card {
    background: #ffffff;
    border-radius: 18px;
    max-width: 440px;
    width: 100%;
    padding: 44px 36px 32px;
    text-align: center;
  }
  .icon {
    width: 72px;
    height: 72px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: #292929;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon svg { width: 38px; height: 38px; color: #ffffff; }
  h1 { font-size: 26px; font-weight: 700; margin-bottom: 10px; letter-spacing: -.5px; }
  p { font-size: 14px; color: #727272; line-height: 1.6; margin-bottom: 26px; }
  .btn {
    display: block;
    width: 100%;
    padding: 14px 20px;
    background: #171717;
    color: #ffffff;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    transition: background .15s;
    font-family: inherit;
  }
  .btn:hover { background: #2f2f2f; }
  .hint {
    margin-top: 14px;
    font-size: 11.5px;
    color: #a2a2a2;
  }
</style>
<link rel="stylesheet" href="css/sistema-visual.css?v=7">
<link rel="stylesheet" href="css/interfaz-tipografia.css?v=1">
</head>
<body class="fv-pago">
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="5 13 10 18 20 7"/>
      </svg>
    </div>
    <h1>Pago recibido</h1>
    <p>Estamos comprobando la acreditación en tu cuenta. Verás el movimiento en «Mis pagos» cuando termine.</p>
    <a href="app.html?payment=success" class="btn" id="volverApp">Volver a la plataforma</a>
    <p class="hint">Redirigiendo en <span id="c">6</span> s…</p>
  </div>
<script>
  var paymentId = new URLSearchParams(location.search).get('payment_id') || '';
  var destino = 'app.html?payment=success' + (/^\d+$/.test(paymentId) ? '&payment_id=' + encodeURIComponent(paymentId) : '');
  document.getElementById('volverApp').href = destino;
  var s = 6;
  var el = document.getElementById('c');
  var t = setInterval(function () {
    s--;
    el.textContent = s;
    if (s <= 0) { clearInterval(t); location.href = destino; }
  }, 1000);
</script>
</body>
</html>
