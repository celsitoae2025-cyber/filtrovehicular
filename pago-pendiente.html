<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pago en proceso · Filtro Vehicular+</title>
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg?v=2">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI", "Segoe UI Variable Text", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f5f5f5;
    padding: 20px;
    color: #141d1c;
  }
  .card {
    background: #fff;
    border-radius: 18px;
    max-width: 440px;
    width: 100%;
    padding: 44px 36px 32px;
    text-align: center;
  }
  .icon {
    width: 72px;
    height: 72px;
    margin: 0 auto 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon.pending { background: #141d1c; }
  .icon.failure { background: #141d1c; }
  .icon svg { width: 38px; height: 38px; color: #fff; }
  h1 { font-size: 26px; font-weight: 700; margin-bottom: 10px; letter-spacing: -.5px; }
  p { font-size: 14px; color: #6b7280; line-height: 1.6; margin-bottom: 26px; }
  .btn {
    display: block;
    width: 100%;
    padding: 14px 20px;
    background: #141d1c;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    transition: background .15s;
  }
  .btn:hover { background: #0e1312; }
  .wa {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
    color: #141d1c;
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
  }
  .wa:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon pending" id="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12 6 12 12 16 14"/>
      </svg>
    </div>
    <h1 id="title">Pago en proceso</h1>
    <p id="desc">Mercado Pago está verificando tu pago. Puede tardar unos minutos. Apenas se apruebe, tus créditos se acreditan automáticamente.</p>
    <a href="app.html" class="btn">Volver al dashboard</a>
    <a class="wa" href="https://wa.me/51932465820" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M12 2C6.5 2 2 6.5 2 12c0 1.8.5 3.5 1.3 5L2 22l5.2-1.3c1.4.8 3 1.3 4.8 1.3 5.5 0 10-4.5 10-10S17.5 2 12 2z"/></svg>
      ¿Tienes problemas? Escríbenos por WhatsApp
    </a>
  </div>
<script>
  var params = new URLSearchParams(location.search);
  var status = params.get('status');
  if (status === 'failure') {
    document.getElementById('icon').className = 'icon failure';
    document.getElementById('title').textContent = 'Pago rechazado';
    document.getElementById('desc').textContent = 'Tu pago no pudo ser procesado. Puedes volver a intentarlo o coordinar por WhatsApp.';
    document.querySelector('.icon svg').innerHTML = '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>';
  }
</script>
</body>
</html>
