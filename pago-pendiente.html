<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pago en proceso · Filtro Vehicular+</title>
<link rel="icon" type="image/png" href="/favicon-fvplus.png" sizes="192x192">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Inter", "Segoe UI", "Segoe UI Variable Text", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f6f6f6;
    padding: 20px;
    color: #171717;
  }
  .card {
    background: #ffffff;
    border-radius: 18px;
    max-width: 440px;
    width: 100%;
    padding: 44px 36px 32px;
    text-align: center;
  }
  .icon {
    width: 72px;
    height: 72px;
    margin: 0 auto 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon.pending { background: #171717; }
  .icon.failure { background: #171717; }
  .icon svg { width: 38px; height: 38px; color: #ffffff; }
  h1 { font-size: 26px; font-weight: 700; margin-bottom: 10px; letter-spacing: -.5px; }
  p { font-size: 14px; color: #727272; line-height: 1.6; margin-bottom: 26px; }
  .btn {
    display: block;
    width: 100%;
    padding: 14px 20px;
    background: #171717;
    color: #ffffff;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    transition: background .15s;
  }
  .btn:hover { background: #2f2f2f; }
  .wa {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
    color: #171717;
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
  }
  .wa:hover { text-decoration: underline; }
</style>
<link rel="stylesheet" href="css/sistema-visual.css?v=7">
<link rel="stylesheet" href="css/interfaz-tipografia.css?v=1">
<link rel="stylesheet" href="css/plataforma.css?v=23">
</head>
<body class="fv-pago">
  <div class="card">
    <div class="icon pending" id="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12 6 12 12 16 14"/>
      </svg>
    </div>
    <h1 id="title">Pago en proceso</h1>
    <p id="desc">Mercado Pago está verificando tu pago. Puede tardar unos minutos. Apenas se apruebe, tus créditos se acreditan automáticamente.</p>
    <a href="app.html" class="btn">Volver a la plataforma</a>
    <a class="wa" href="https://wa.me/51932465820" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 11.8a8.5 8.5 0 0 1-12.7 7.4L3 20.5l1.3-4.7A8.5 8.5 0 1 1 20.5 11.8Z"/><path d="m8 7.4 1.2-.3 1.1 2.4-1.1.9a8.9 8.9 0 0 0 4.2 4.2l.9-1.1 2.4 1.1-.3 1.2c-.2.8-1 1.2-1.8 1a12 12 0 0 1-7.3-7.3c-.2-.8.2-1.6 1-1.8Z"/></svg>
      ¿Tienes problemas? Escríbenos por WhatsApp
    </a>
  </div>
<script>
  var params = new URLSearchParams(location.search);
  var status = params.get('status');
  if (status === 'failure') {
    document.getElementById('icon').className = 'icon failure';
    document.getElementById('title').textContent = 'Pago rechazado';
    document.getElementById('desc').textContent = 'Tu pago no pudo ser procesado. Puedes volver a intentarlo o coordinar por WhatsApp.';
    document.querySelector('.icon svg').innerHTML = '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>';
  }
</script>
</body>
</html>
